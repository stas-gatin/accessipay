<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout - Demo Shop</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #ffffff; }
  main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 24px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
  input { padding: 8px; border: 1px solid #555; border-radius: 6px; font-size: 16px; }
  button, .btn { padding: 8px 12px; border: 1px solid #333; background: #f2f2f2; color: #1a1a1a; border-radius: 6px; font-size: 16px; cursor: pointer; }
  .pay { background: #0b3d91; color: #ffffff; border-color: #0b3d91; }
  .err { color: #8a1c1c; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Checkout</h1>
  <p>Backpack, quantity 1, total $49.00</p>

  <div class="row">
    <label for="coupon">Coupon code</label>
    <input id="coupon" type="text">
  </div>
  <div class="row" id="coupon-actions"></div>
  <div id="msg"></div>

  <div id="pay-area"></div>
</main>

<script>
  const variant = new URLSearchParams(location.search).get('v') === 'fixed' ? 'fixed' : 'broken';
  const icon = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  const actions = document.getElementById('coupon-actions');
  const pay = document.getElementById('pay-area');
  const msg = document.getElementById('msg');

  if (variant === 'broken') {
    // Names exist, so a rule scanner passes them, but they say nothing about what each button does.
    actions.innerHTML =
      '<button aria-label="button" data-act="apply">' + icon + '</button>' +
      '<button aria-label="button" data-act="remove">' + icon + '</button>' +
      '<button aria-label="button" data-act="close">' + icon + '</button>';
    // A clickable div with no role: not a button for assistive technology.
    pay.innerHTML = '<div class="btn pay" data-act="pay">Pay now</div>';
    msg.className = 'err';            // error text with no live region
  } else {
    actions.innerHTML =
      '<button data-act="apply">' + icon + ' Apply coupon</button>' +
      '<button data-act="remove">' + icon + ' Remove coupon</button>';
    pay.innerHTML = '<button class="pay" data-act="pay">Pay now</button>';
    msg.className = 'err';
    msg.setAttribute('role', 'alert');
  }

  document.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'apply') msg.textContent = 'Coupon code is not valid.';
    if (act === 'pay') { document.body.dataset.paid = 'yes'; msg.textContent = 'Order placed. Thank you.'; document.title = 'Order placed'; }
  });
</script>
</body>
</html>
