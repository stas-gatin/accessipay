<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img"
  aria-label="AccessiPay: accessibility, measured in completed payments. Live example: the scanner reports 0 violations on a cart page, a keyboard-only customer is trapped by a promo popup and cannot pay; after 7 AI changes the same customer pays and PayPal reports the order as COMPLETED.">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.3" r="1">
      <stop offset="0" stop-color="#143563"/><stop offset="0.6" stop-color="#0a1a33"/><stop offset="1" stop-color="#050d1d"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .ring { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.4s ease-out 0.2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .btn { transform-box: fill-box; transform-origin: center; animation: press 2.4s ease-in-out 1.6s infinite; }
      @keyframes press { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(0.86); } 90% { transform: scale(1.04); } }
      .pill { opacity: 0; animation: pin 0.6s ease-out forwards; }
      @keyframes pin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .r { opacity: 0; animation: row 12s ease-out infinite; }
      @keyframes row { 0% { opacity: 0; transform: translateX(16px); } 3% { opacity: 1; transform: translateX(0); } 90% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .bad { opacity: 0; animation: bad 12s ease-out infinite; }
      @keyframes bad { 0% { opacity: 0; transform: scale(1.4); } 3% { opacity: 1; transform: scale(1); } 90% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .stamp { opacity: 0; transform-box: fill-box; transform-origin: center; animation: stamp 12s ease-out infinite; }
      @keyframes stamp { 0% { opacity: 0; transform: rotate(-6deg) scale(2.2); } 3% { opacity: 1; transform: rotate(-6deg) scale(1); } 90% { opacity: 1; transform: rotate(-6deg) scale(1); } 96%, 100% { opacity: 0; transform: rotate(-6deg) scale(1); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#dots)"/>

  <!-- left: name and promise -->
  <text x="56" y="70" class="m" font-size="14" letter-spacing="3" fill="#5ef1c2">PAYPAL AI HACKATHON 2026</text>
  <g transform="translate(56,100)">
    <rect class="ring" x="1.5" y="1.5" width="81" height="45" rx="22.5" fill="none" stroke="#ffffff" stroke-width="4" pathLength="100"/>
    <rect class="btn" x="12" y="12" width="60" height="24" rx="12" fill="#5ef1c2"/>
  </g>
  <text x="160" y="142" class="t" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1.5">AccessiPay</text>
  <text x="56" y="196" class="t" font-size="26" font-weight="600" fill="#ffffff">Accessibility, measured in <tspan fill="#5ef1c2">completed payments</tspan>.</text>
  <text x="56" y="236" class="t" font-size="17" fill="#a9bdd4">Three simulated customers try to buy: a screen reader user, a keyboard-only user</text>
  <text x="56" y="260" class="t" font-size="17" fill="#a9bdd4">and an AI shopping agent. When one gets stuck, AI fixes the page and the same</text>
  <text x="56" y="284" class="t" font-size="17" fill="#a9bdd4">customer tries again. A test passes only when PayPal confirms the order.</text>
  <g class="t" font-size="14" font-weight="600">
    <g class="pill" style="animation-delay:0.3s"><rect x="56" y="330" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.09"/><circle cx="76" cy="347" r="5" fill="#5ef1c2"/><text x="90" y="352" fill="#e8eef5">Screen reader</text></g>
    <g class="pill" style="animation-delay:0.6s"><rect x="242" y="330" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.09"/><circle cx="262" cy="347" r="5" fill="#5ef1c2"/><text x="276" y="352" fill="#e8eef5">Keyboard-only</text></g>
    <g class="pill" style="animation-delay:0.9s"><rect x="412" y="330" width="166" height="34" rx="17" fill="#ffffff" fill-opacity="0.09"/><circle cx="432" cy="347" r="5" fill="#5ef1c2"/><text x="446" y="352" fill="#e8eef5">AI shopping agent</text></g>
    <g class="pill" style="animation-delay:1.2s"><rect x="588" y="330" width="214" height="34" rx="17" fill="#0070e0"/><text x="608" y="352" fill="#ffffff">PayPal Orders v2 · sandbox</text></g>
  </g>

  <!-- right: one real case, replayed -->
  <rect x="852" y="36" width="392" height="348" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.13"/>
  <text x="874" y="66" class="m" font-size="11" letter-spacing="2" fill="#5ef1c2">RECORDED RUN · DEMO SHOP · CART PAGE</text>
  <g class="t" font-size="14">
    <g class="r" style="animation-delay:0.4s">
      <rect x="872" y="80" width="352" height="34" rx="9" fill="#5ef1c2" fill-opacity="0.14"/>
      <text x="886" y="102" fill="#d8fff1">axe-core scan</text><text x="1210" y="102" text-anchor="end" font-weight="700" fill="#5ef1c2">0 violations ✓</text>
    </g>
    <g class="r m" font-size="13" style="animation-delay:1.2s"><rect x="872" y="122" width="76" height="24" rx="6" fill="#ffffff" fill-opacity="0.12"/><text x="910" y="139" text-anchor="middle" fill="#ffffff">Enter</text><text x="958" y="139" class="t" font-size="14" fill="#cfdbe8">a promo popup takes focus</text></g>
    <g class="r m" font-size="13" style="animation-delay:2.0s"><rect x="872" y="154" width="76" height="24" rx="6" fill="#ffffff" fill-opacity="0.12"/><text x="910" y="171" text-anchor="middle" fill="#ffffff">Escape</text><text x="958" y="171" class="t" font-size="14" fill="#ff8a83">nothing happens</text></g>
    <g class="r m" font-size="13" style="animation-delay:2.6s"><rect x="872" y="186" width="76" height="24" rx="6" fill="#ffffff" fill-opacity="0.12"/><text x="910" y="203" text-anchor="middle" fill="#ffffff">Tab</text><text x="958" y="203" class="t" font-size="14" fill="#ff8a83">focus stays inside the popup</text></g>
    <g class="bad" style="animation-delay:3.3s"><rect x="872" y="220" width="352" height="40" rx="10" fill="#ff4f45"/><text x="1048" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">✕ Keyboard customer could not pay</text></g>
    <g class="r" style="animation-delay:4.6s"><rect x="872" y="270" width="352" height="34" rx="9" fill="#ffffff" fill-opacity="0.08"/><text x="886" y="292" fill="#ffffff"><tspan fill="#5ef1c2" font-weight="700">AI fix</tspan>  ·  7 changes to the cart page</text></g>
    <g class="r" style="animation-delay:5.6s"><text x="874" y="336" fill="#cfdbe8">Same customer, same task:</text><text x="874" y="358" font-weight="700" fill="#ffffff">paid in 49 steps</text></g>
  </g>
  <g class="stamp" style="animation-delay:6.4s">
    <rect x="1060" y="316" width="164" height="46" rx="10" fill="#e6fbf3" stroke="#0a8a5f" stroke-width="4"/>
    <text x="1142" y="347" text-anchor="middle" class="t" font-size="20" font-weight="800" letter-spacing="1" fill="#0a8a5f">COMPLETED</text>
  </g>
</svg>
